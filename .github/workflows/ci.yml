name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs neither a database nor a TeX Live image. Fast, and
  # the first thing to look at when CI is red.
  check:
    name: format / lint / typecheck / unit / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # No DATABASE_URL here, so the lib/queries suites self-skip; the
      # integration job below runs them for real.
      - run: npm test
      - run: npm run build

  # The bar the project actually cares about: the seeded V1 resume still
  # round-trips out of a real Postgres and compiles through real pdflatex.
  integration:
    name: db / smoke / e2e
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://resumix:resumix@localhost:5433/resumix
      LATEX_SERVICE_URL: http://localhost:8080
      APP_PASSWORD: e2e-password
      AUTH_SECRET: e2e-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Start postgres and the latex sidecar
        run: docker compose up -d --wait db latex

      - run: npm run db:migrate
      - run: npm run db:seed -- --force

      # Runs with DATABASE_URL set, so the 16 lib/queries integration tests
      # that self-skip in the `check` job actually execute here.
      - run: npm test

      - run: npm run smoke

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Sidecar logs on failure
        if: failure()
        run: docker compose logs latex
