services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: resumix
      POSTGRES_PASSWORD: resumix
      POSTGRES_DB: resumix
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resumix -d resumix']
      interval: 5s
      timeout: 5s
      retries: 10

  latex:
    build: ./services/latex
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
